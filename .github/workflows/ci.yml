name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: mkdir -p tests/out
      - run: python3 -m pip install -r tests/requirements.txt
      - run: python3 tests/static_checks.py
      - run: ruff check .
      - run: python3 tests/ci_checks.py
      - name: Unit tests with branch coverage, including hook subprocesses
        run: |
          python3 -m coverage run --parallel-mode -m unittest discover -s tests/unit -v
          python3 -m coverage combine --quiet
          python3 -m coverage report
          python3 -m coverage xml -o tests/out/coverage.xml
        env:
          BOYSCOUT_COVERAGE: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: tests/out/coverage.xml
          if-no-files-found: warn
          retention-days: 7

  javascript:
    name: OpenCode adapter and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Lint workflows with pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - run: npm ci --ignore-scripts --prefix tests
      - run: npm run typecheck --prefix tests
      - run: npm test --prefix tests
      - run: npm audit --audit-level=high --prefix tests
      - name: Validate distributable contents
        run: python3 tests/package_check.py
